<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#087f3f">
  <title>Flash Sale 6H–10H</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="brand">BÁCH HÓA XANH</div>
    <div class="hero">
      <h1>⚡ FLASH SALE 6H–10H</h1>
      <p>Khuyến mãi cực sốc — số lượng có hạn</p>
      <div id="countdown">Đang tải...</div>
    </div>
  </header>

  <main>
    <section id="closed" class="notice hidden"></section>

    <section>
      <h2>Sản phẩm Flash Sale</h2>
      <div id="products" class="grid"></div>
    </section>

    <section class="order">
      <h2>Đặt hàng</h2>
      <form id="orderForm">
        <input name="name" placeholder="Họ và tên" required>
        <input name="phone" placeholder="Số điện thoại" required>
        <input name="store" placeholder="Cửa hàng nhận hàng" required>
        <select name="productId" id="productSelect" required></select>
        <input name="qty" type="number" min="1" value="1" required>
        <textarea name="note" placeholder="Ghi chú"></textarea>
        <button>ĐẶT HÀNG NGAY</button>
      </form>
      <div id="result"></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
