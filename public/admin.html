<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Flash Sale</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>⚙️ ADMIN FLASH SALE</h1>

    <!-- Khung đăng nhập Administrator -->
    <div id="login">
      <input id="key" type="password" placeholder="ADMIN_API_KEY">
      <button onclick="login()">Đăng nhập</button>
    </div>

    <!-- Bảng điều khiển Quản trị (mặc định bị ẩn) -->
    <div id="panel" class="hidden">
      <h2>Thêm / cập nhật CTKM theo SKU</h2>
      <form id="productForm" class="adminform">
        <input name="id" placeholder="SKU06" required>
        <input name="name" placeholder="Tên sản phẩm" required>
        <input name="description" placeholder="Mô tả">
        <input name="emoji" placeholder="🍗">
        <input name="oldPrice" type="number" placeholder="Giá cũ" required>
        <input name="price" type="number" placeholder="Giá Flash Sale" required>
        <input name="stock" type="number" placeholder="Tồn kho" required>
        <input name="promoTitle" placeholder="Tên CTKM">
        <input name="promoText" placeholder="Nội dung CTKM">
        <button>LƯU SẢN PHẨM / CTKM</button>
      </form>

      <h2>Sản phẩm</h2>
      <div id="plist"></div>

      <h2>Đơn hàng</h2>
      <div id="orders"></div>
    </div>
  </main>

  <script src="/admin.js"></script>
</body>
</html>
